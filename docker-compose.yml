version: '3.8'

services:
  static-todo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bni-static-monochrome-todo
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
