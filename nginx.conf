# ==============================================================================
# Nginx Static Site Server Block - Task Ledger (Monochromatic Static Edition)
# BNI ODP IT 2026 - Production Web Architecture
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Root direktori tempat file statis disajikan
    root /usr/share/nginx/html;
    index index.html;

    # Charset bawaan
    charset utf-8;

    # ==========================================================================
    # GZIP COMPRESSION CONFIGURATION
    # Mengurangi ukuran transfer payload HTML, CSS, dan JS hingga 70%
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ==========================================================================
    # SECURITY HEADERS
    # Standar pengerasan (hardening) aplikasi web perbankan
    # ==========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==========================================================================
    # ROUTING & FALLBACK
    # ==========================================================================
    location / {
        # Mencari berkas fisik ($uri), lalu direktori ($uri/),
        # fallback ke index.html jika tidak ditemukan
        try_files $uri $uri/ /index.html =404;
    }

    # ==========================================================================
    # CACHING UNTUK ASET STATIS (CSS, JS, GAMBAR)
    # ==========================================================================
    location ~* \.(css|js|svg|png|jpg|jpeg|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Nonaktifkan akses ke berkas tersembunyi (.git, .env, dll)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom halaman error 404 & 50x
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
